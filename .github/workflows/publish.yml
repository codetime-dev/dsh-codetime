name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 (npm 11+) is required for OIDC trusted publishing; Node 22's
      # bundled npm 10 fails the publish with a misleading E404/ENEEDAUTH.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
