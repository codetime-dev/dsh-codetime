name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # NOTE: do NOT set registry-url for an OIDC-only publish. setup-node
          # then writes an .npmrc with _authToken=${NODE_AUTH_TOKEN} and exports
          # a placeholder token, which npm prefers over the OIDC exchange and
          # surfaces as a misleading 404 on the PUT.

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
